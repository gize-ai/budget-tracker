<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Мой ритм — заметки, дела, привычки и личные финансы в одном спокойном пространстве.">
  <title>Мой ритм</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="#today" class="wordmark" aria-label="Мой ритм — Сегодня">МОЙ РИТМ<span class="wordmark-dot">.</span></a>
      <div class="topbar-right"><span id="header-date"></span><button class="icon-button" id="settings-button" aria-label="Настройки"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="#0b0b0b"/><circle cx="15" cy="17" r="2.5" fill="#0b0b0b"/></svg></button></div>
    </header>
    <div id="mode-banner" class="mode-banner" hidden></div>
    <main id="main" tabindex="-1"><div class="loading-state"><span class="loading-mark"></span><p>Собираем твой день…</p></div></main>
    <div class="add-dock"><button class="primary-button add-button" id="add-button"><span class="plus-mark" aria-hidden="true">+</span>Добавить запись</button></div>
    <nav class="bottom-nav" aria-label="Основные разделы">
      <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Сегодня</span></a>
      <a href="#notes" data-tab="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6m-6 4h6m-6 4h3"/></svg><span>Заметки</span></a>
      <a href="#habits" data-tab="habits"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0 0 5M20 3v6h-6m-6 3 3 3 5-6"/></svg><span>Привычки</span></a>
      <a href="#finance" data-tab="finance"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 5h2M7 5V3h10v2"/></svg><span>Финансы</span></a>
    </nav>
  </div>
  <dialog id="sheet" class="sheet"><div class="sheet-handle"></div><div class="sheet-header"><h2 id="sheet-title"></h2><button class="icon-button" id="close-sheet" aria-label="Закрыть">×</button></div><div id="sheet-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Для работы приложения включи JavaScript в браузере.</noscript>
</body>
</html>
