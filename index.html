<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finance</title>
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#000000">
</head>
<body>
<div id="app">

  <!-- Верхний экран: Баланс -->
  <div class="screen active" id="screen-home">
    <div class="header">
      <h1>Финансы</h1>
      <button class="icon-btn" onclick="showSettings()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
    
    <div class="balance-card">
      <div class="balance-label">Общий баланс</div>
      <div class="balance-amount" id="totalBalance">0 ₽</div>
      <div class="balance-change" id="balanceChange">+0 ₽ за месяц</div>
    </div>

    <div class="section-header">
      <span>Операции</span>
      <button class="text-btn" onclick="showAddTx()">+ Добавить</button>
    </div>
    <div class="list" id="recentList"></div>
  </div>

  <!-- Экран: Долги -->
  <div class="screen" id="screen-debts">
    <div class="header"><h1>Долги</h1></div>
    <div class="segmented-control">
      <button class="seg-active" onclick="switchDebtTab('owed')" id="tab-owed">Мне должны</button>
      <button onclick="switchDebtTab('iowe')" id="tab-iowe">Я должен</button>
      <button onclick="switchDebtTab('cards')" id="tab-cards">Кредитки</button>
    </div>
    <div id="debtsContent"></div>
    <button class="fab" onclick="showAddDebt()">+</button>
  </div>

  <!-- Экран: Инвестиции -->
  <div class="screen" id="screen-invest">
    <div class="header"><h1>Инвестиции</h1></div>
    <div class="invest-summary" id="investSummary"></div>
    <div class="section-header"><span>Портфель</span></div>
    <div class="list" id="investList"></div>
    <button class="fab" onclick="showAddInvest()">+</button>
  </div>

  <!-- Экран: Кастомные разделы -->
  <div class="screen" id="screen-custom">
    <div class="header"><h1>Разделы</h1></div>
    <div class="list" id="customSections"></div>
    <button class="fab" onclick="showAddSection()">+</button>
  </div>

  <!-- Экран: Поиск -->
  <div class="screen" id="screen-search">
    <div class="header"><h1>Поиск</h1></div>
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск по всем разделам..." oninput="doSearch()">
    </div>
    <div class="list" id="searchResults"></div>
  </div>

  <!-- Экран: AI -->
  <div class="screen" id="screen-ai">
    <div class="header"><h1>AI Помощник</h1></div>
    <div class="ai-chat" id="aiChat">
      <div class="ai-msg ai-bot">Привет! Задай вопрос о своих финансах или попроси совета.</div>
    </div>
    <div class="ai-input-bar">
      <input type="text" id="aiInput" placeholder="Сколько я потратил на энергос?">
      <button onclick="sendAi()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

  <!-- Нижний таб-бар -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="setScreen('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Главная</span>
    </button>
    <button class="tab-btn" onclick="setScreen('debts')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <span>Долги</span>
    </button>
    <button class="tab-btn tab-add" onclick="showAddTx()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="tab-btn" onclick="setScreen('invest')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      <span>Инвест</span>
    </button>
    <button class="tab-btn" onclick="setScreen('custom')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span>Разделы</span>
    </button>
  </div>

  <!-- Модалка: Добавить операцию -->
  <div class="modal" id="modal-tx">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2>Новая операция</h2>
      <div class="form">
        <div class="form-row">
          <button class="type-btn active" onclick="setTxType('expense')" id="tx-btn-exp">Расход</button>
          <button class="type-btn" onclick="setTxType('income')" id="tx-btn-inc">Доход</button>
        </div>
        <input type="number" id="txAmount" placeholder="Сумма" step="0.01">
        <input type="text" id="txDesc" placeholder="Описание (например: энергос)">
        <div class="custom-cat-row">
          <select id="txCat">
            <option value="Продукты">Продукты</option>
            <option value="Жильё">Жильё</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Арбитраж">Арбитраж</option>
            <option value="Закупка аков">Закупка аков</option>
            <option value="Депозит">Депозит</option>
            <option value="Прочее">Прочее</option>
          </select>
          <input type="text" id="txCustomCat" placeholder="Или своя категория..." style="flex:1">
        </div>
        <button class="btn-primary" onclick="addTx()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка: Добавить долг -->
  <div class="modal" id="modal-debt">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2>Долг</h2>
      <div class="form">
        <select id="debtType">
          <option value="owed">Мне должны</option>
          <option value="iowe">Я должен</option>
          <option value="card">Кредитка</option>
        </select>
        <input type="text" id="debtPerson" placeholder="Кому / Кто">
        <input type="number" id="debtAmount" placeholder="Сумма">
        <input type="number" id="debtRate" placeholder="Процент (если есть)">
        <input type="date" id="debtDate" placeholder="Дата возврата">
        <button class="btn-primary" onclick="addDebt()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка: Инвестиция -->
  <div class="modal" id="modal-invest">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2>Инвестиция</h2>
      <div class="form">
        <select id="invType">
          <option value="stock">Акция / Фонд</option>
          <option value="crypto">Крипта</option>
        </select>
        <input type="text" id="invName" placeholder="Название (AAPL, BTC)">
        <input type="number" id="invQty" placeholder="Количество" step="0.0001">
        <input type="number" id="invBuy" placeholder="Цена покупки (₽)">
        <input type="number" id="invCurrent" placeholder="Текущая цена (₽)">
        <button class="btn-primary" onclick="addInvest()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка: Кастомный раздел -->
  <div class="modal" id="modal-section">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2>Новый раздел</h2>
      <div class="form">
        <input type="text" id="secName" placeholder="Название (например: Арбитраж)">
        <button class="btn-primary" onclick="addSection()">Создать</button>
      </div>
    </div>
  </div>

  <!-- Модалка: Настройки -->
  <div class="modal" id="modal-settings">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2>Настройки</h2>
      <div class="form">
        <label>AI API Key (OpenRouter)</label>
        <input type="password" id="aiKey" placeholder="sk-or-v1-..." onchange="saveSettings()">
        <label style="margin-top:16px">Telegram ID для синхронизации</label>
        <input type="text" id="tgId" placeholder="123456789" onchange="saveSettings()">
        <div class="hint">Настройте Siri Shortcuts для голосового ввода</div>
        <button class="btn-secondary" onclick="exportData()">Экспорт JSON</button>
        <button class="btn-secondary" onclick="importData()">Импорт JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="handleImport(event)">
      </div>
    </div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
