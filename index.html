<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LifeDash</title>
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#000000">
</head>
<body>
<div id="app">

  <!-- Боковое меню -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar">L</div>
      <div class="sidebar-name">LifeDash</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="navigate('home')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Главная</span>
      </button>
      <button class="nav-item" onclick="navigate('projects')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>Финансы</span>
      </button>
      <button class="nav-item" onclick="navigate('life')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <span>Жизнь</span>
      </button>
      <button class="nav-item" onclick="navigate('settings')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Настройки</span>
      </button>
    </nav>
  </div>

  <!-- Header -->
  <header class="top-header">
    <button class="header-btn" onclick="toggleSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 id="pageTitle">Главная</h1>
    <button class="header-btn" onclick="showAdd()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </header>

  <!-- Экраны -->
  <main class="main-content" id="mainContent">

    <!-- ГЛАВНАЯ -->
    <div class="page active" id="page-home">
      <div class="balance-section">
        <div class="balance-label">Баланс</div>
        <div class="balance-amount" id="homeBalance">0 ₽</div>
        <div class="balance-change" id="homeChange">0 ₽ за месяц</div>
        <button class="debt-badge" id="debtBadge" onclick="navigate('debts')" style="display:none">
          Долга: <span id="debtBadgeSum">0 ₽</span>
        </button>
      </div>

      <div class="analytics-grid">
        <div class="an-card">
          <div class="an-label">Экономия</div>
          <div class="an-value" id="anSave">0 ₽</div>
        </div>
        <div class="an-card">
          <div class="an-label">Прогноз (год)</div>
          <div class="an-value" id="anYear">0 ₽</div>
        </div>
      </div>

      <div class="section-title">Последние операции</div>
      <div class="list" id="homeList"></div>
    </div>

    <!-- ФИНАНСЫ (подменю) -->
    <div class="page" id="page-projects">
      <div class="submenu">
        <button class="sub-btn active" onclick="switchSub('proj')">Разделы</button>
        <button class="sub-btn" onclick="switchSub('debts')">Долги</button>
        <button class="sub-btn" onclick="switchSub('inv')">Инвестиции</button>
      </div>
      
      <div class="sub-page active" id="sub-proj">
        <div class="list" id="projList"></div>
        <button class="add-btn" onclick="showModal('modal-project')">+ Новый раздел</button>
      </div>
      
      <div class="sub-page" id="sub-debts">
        <div class="list" id="debtList"></div>
        <button class="add-btn" onclick="showModal('modal-debt')">+ Новый долг</button>
      </div>
      
      <div class="sub-page" id="sub-inv">
        <div class="list" id="invList"></div>
        <button class="add-btn" onclick="showModal('modal-invest')">+ Новая инвестиция</button>
      </div>
    </div>

    <!-- ЖИЗНЬ (подменю) -->
    <div class="page" id="page-life">
      <div class="submenu">
        <button class="sub-btn active" onclick="switchSubLife('notes')">Заметки</button>
        <button class="sub-btn" onclick="switchSubLife('habits')">Привычки</button>
      </div>
      
      <div class="sub-page active" id="sub-notes">
        <div class="note-folders" id="noteFolders"></div>
        <div class="section-title">Общие заметки</div>
        <div class="list" id="noteList"></div>
        <button class="add-btn" onclick="showModal('modal-note')">+ Новая заметка</button>
      </div>
      
      <div class="sub-page" id="sub-habits">
        <div class="list" id="habitList"></div>
        <button class="add-btn" onclick="showModal('modal-habit')">+ Новая привычка</button>
      </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="page" id="page-settings">
      <div class="settings-group">
        <div class="settings-label">Синхронизация</div>
        <input type="text" id="setTgId" placeholder="Telegram ID" onchange="saveSet()">
        <div class="settings-hint">Введите ID, чтобы данные синхронизировались с ботом</div>
      </div>
      <div class="settings-group">
        <div class="settings-label">Данные</div>
        <button class="settings-btn" onclick="exportData()">Экспорт JSON</button>
        <button class="settings-btn" onclick="importData()">Импорт JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="handleImport(event)">
      </div>
      <button class="settings-btn danger" onclick="clearAll()">Очистить все данные</button>
    </div>

  </main>

  <!-- Bottom Sheet: Добавить операцию -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheets()"></div>
  <div class="bottom-sheet" id="sheet-tx">
    <div class="sheet-handle"></div>
    <h3>Операция</h3>
    <div class="sheet-body">
      <div class="tx-toggle">
        <button class="tx-type active" onclick="setTxType('expense')">Расход</button>
        <button class="tx-type" onclick="setTxType('income')">Доход</button>
      </div>
      <input type="number" id="txSum" placeholder="Сумма" step="0.01">
      <input type="text" id="txCat" placeholder="Категория (например: продукты)">
      <input type="text" id="txDesc" placeholder="Описание (необязательно)">
      <select id="txProject">
        <option value="">Без раздела</option>
      </select>
      <button class="btn-primary" onclick="addTx()">Сохранить</button>
    </div>
  </div>

  <!-- Bottom Sheet: Новый раздел -->
  <div class="bottom-sheet" id="sheet-project">
    <div class="sheet-handle"></div>
    <h3>Новый раздел</h3>
    <input type="text" id="projName" placeholder="Название">
    <button class="btn-primary" onclick="addProject()">Создать</button>
  </div>

  <!-- Bottom Sheet: Новый долг -->
  <div class="bottom-sheet" id="sheet-debt">
    <div class="sheet-handle"></div>
    <h3>Новый долг</h3>
    <input type="text" id="debtName" placeholder="Название (например: Кредит Тиньк)">
    <input type="number" id="debtSum" placeholder="Сумма">
    <input type="number" id="debtRate" placeholder="Процент (если есть)">
    <input type="date" id="debtDue" placeholder="Срок (необязательно)">
    <button class="btn-primary" onclick="addDebt()">Создать</button>
  </div>

  <!-- Bottom Sheet: Платёж по долгу -->
  <div class="bottom-sheet" id="sheet-debtpay">
    <div class="sheet-handle"></div>
    <h3>Погасить</h3>
    <input type="number" id="debtPaySum" placeholder="Сумма платежа">
    <button class="btn-primary" onclick="payDebt()">Сохранить</button>
  </div>

  <!-- Bottom Sheet: Инвестиция -->
  <div class="bottom-sheet" id="sheet-invest">
    <div class="sheet-handle"></div>
    <h3>Инвестиция</h3>
    <select id="invKind" onchange="onInvKind()">
      <option value="deposit">Вклад (проценты)</option>
      <option value="crypto">Крипта / Акции</option>
      <option value="other">Другое</option>
    </select>
    <input type="text" id="invName" placeholder="Название">
    <input type="number" id="invAmount" placeholder="Сумма / Количество">
    <input type="number" id="invRate" placeholder="Процент годовых (для вклада)">
    <input type="number" id="invPrice" placeholder="Цена покупки (для крипты)">
    <input type="number" id="invCurrent" placeholder="Текущая цена (для крипты)">
    <button class="btn-primary" onclick="addInvest()">Сохранить</button>
  </div>

  <!-- Bottom Sheet: Заметка -->
  <div class="bottom-sheet" id="sheet-note">
    <div class="sheet-handle"></div>
    <h3>Заметка</h3>
    <input type="text" id="noteTitle" placeholder="Заголовок">
    <textarea id="noteBody" placeholder="Текст заметки" rows="4"></textarea>
    <select id="noteFolder">
      <option value="">Общие</option>
    </select>
    <button class="btn-primary" onclick="addNote()">Сохранить</button>
  </div>

  <!-- Bottom Sheet: Папка заметок -->
  <div class="bottom-sheet" id="sheet-folder">
    <div class="sheet-handle"></div>
    <h3>Новая папка</h3>
    <input type="text" id="folderName" placeholder="Название папки">
    <button class="btn-primary" onclick="addFolder()">Создать</button>
  </div>

  <!-- Bottom Sheet: Привычка -->
  <div class="bottom-sheet" id="sheet-habit">
    <div class="sheet-handle"></div>
    <h3>Привычка</h3>
    <input type="text" id="habitName" placeholder="Название (например: Не курю)">
    <button class="btn-primary" onclick="addHabit()">Создать</button>
  </div>

  <!-- Toast -->
  <div class="toast-box" id="toastBox"></div>

</div>
<script src="script.js"></script>
</body>
</html>
