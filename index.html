<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Pro</title>
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#050508">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQnVkZ2V0IFBybyIsInNob3J0X25hbWUiOiJCdWRnZXQiLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzA1MDUwOCIsInRoZW1lX2NvbG9yIjoiIzA1MDUwOCJ9">
</head>
<body>
<div class="bg-blob"></div>
<div class="container">

<header>
  <h1>Budget Pro</h1>
  <div style="display:flex;gap:8px">
    <button class="btn-icon" onclick="toggleTheme()" title="Тема"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
  </div>
</header>

<div class="mirror-wrap">
  <div class="summary glass">
    <div class="sum-card sum-income"><div class="sum-label">Доходы</div><div class="sum-value" id="sumIncome">0 ₽</div></div>
    <div class="sum-card sum-expense"><div class="sum-label">Расходы</div><div class="sum-value" id="sumExpense">0 ₽</div></div>
    <div class="sum-card sum-bal"><div class="sum-label">Баланс</div><div class="sum-value" id="sumBalance">0 ₽</div></div>
  </div>
  <div class="mirror"></div>
</div>

<div class="glass">
  <div class="sec-title">Аналитика</div>
  <div id="insights"></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
  <div class="glass">
    <div class="sec-title">Бюджет<button class="btn btn-sec" style="height:32px;padding:0 14px;font-size:12px" onclick="editBudget()">Настроить</button></div>
    <div class="budget-meta" id="budgetMeta"><span>Лимит не задан</span></div>
    <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
  </div>
  <div class="glass">
    <div class="sec-title">Цели<button class="btn btn-sec" style="height:32px;padding:0 14px;font-size:12px" onclick="addGoal()">+ Цель</button></div>
    <div id="goalsList"></div>
  </div>
</div>

<div class="glass">
  <div class="sec-title">Что если?</div>
  <div style="font-size:13px;color:var(--text-sec);margin-bottom:8px">Уменьшите траты на <span id="simPercent">0</span>%</div>
  <input type="range" id="simSlider" min="0" max="50" value="0" oninput="runSim()" style="width:100%;accent-color:var(--accent)">
  <div class="sim-result" id="simResult"></div>
</div>

<div class="glass">
  <div class="sec-title">Тепловая карта</div>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-sec);margin-bottom:8px"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
  <div class="heatmap" id="heatmap"></div>
</div>

<div class="glass">
  <div class="sec-title">Новая операция</div>
  <div class="form-row">
    <div class="field" style="flex:0 0 110px"><label>Тип</label><select id="tType"><option value="income">Доход</option><option value="expense">Расход</option></select></div>
    <div class="field" style="flex:0 0 110px"><label>Валюта</label><select id="tCurrency"><option value="RUB">₽</option><option value="USD">$</option><option value="EUR">€</option><option value="KZT">₸</option></select></div>
    <div class="field"><label>Сумма</label><input type="number" id="tAmount" placeholder="0" min="0" step="0.01"></div>
    <div class="field"><label>Категория</label><select id="tCat"><option>Зарплата</option><option>Фриланс</option><option>Инвестиции</option><option>Продукты</option><option>Транспорт</option><option>Жильё</option><option>Развлечения</option><option>Здоровье</option><option>Покупки</option><option>Образование</option><option>Другое</option></select></div>
    <div class="field" style="flex:1.5"><label>Описание</label><input type="text" id="tDesc" placeholder="Например, зарплата"></div>
    <button class="btn" onclick="addTx()">Добавить</button>
    <button class="btn btn-sec" onclick="startVoice()" title="Голос"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg></button>
  </div>
  <div class="voice-wave" id="voiceWave"><span style="height:100%"></span><span style="height:60%"></span><span style="height:40%"></span><span style="height:80%"></span></div>
</div>

<div class="glass">
  <div class="sec-title">Распределение</div>
  <div class="pie-wrap">
    <svg id="pieChart" width="180" height="180" viewBox="0 0 180 180"></svg>
    <div class="legend" id="chartLegend"></div>
  </div>
</div>

<div class="glass">
  <div class="sec-title">Достижения</div>
  <div class="ach-grid" id="achGrid"></div>
</div>

<div class="glass">
  <div class="sec-title">Операции
    <div style="display:flex;gap:8px;align-items:center">
      <select id="filterPeriod" onchange="render()" style="height:32px;font-size:12px"><option value="all">Всё время</option><option value="today">Сегодня</option><option value="week">Неделя</option><option value="month">Месяц</option></select>
      <input type="text" id="filterSearch" placeholder="Поиск..." oninput="render()" style="height:32px;width:120px;font-size:12px">
      <button class="btn btn-sec" style="height:32px;padding:0 12px;font-size:12px" onclick="exportCSV()">CSV</button>
    </div>
  </div>
  <div class="tx-list" id="txList"></div>
</div>

</div>
<div class="toast-container" id="toastContainer"></div>
<canvas id="confetti" style="display:none"></canvas>
<script src="script.js"></script>
</body>
</html>
